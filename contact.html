<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<link rel="stylesheet" href="styles.css">
	<title>Contact Me</title>
</head>
<body>

<header>
	<h1>Contact Me</h1>
	<nav>
		<a href="index.html">Home</a> |
		<a href="projects.html">Projects</a> |
		<a href="interests.html">Interests</a> |
		<a href="contact.html">Contact</a> 
	</nav>
</header>

<hr>
<main>

	<section class="content-section">
		<h2>Get in Touch</h2>
		<p>
			This form allows visitors to send a mesage about technology, software development, projects, or other questions.
		</p>
		<form id="contact-form" novalidate>
			<div class="form-group">
				<label for="name">Name:</label>
				<input type="text" id="name" name="name" required>
			</div>
			<div class="form-group">
				<label for="email">Email:</label>
				<input type="email" id="email" name="email" required>
			</div>
			<div class="form-group">
				<label for="reason">Reason:</label>
				<select id="reason" name="reason" required>
				<option value="">Select an option</option>
				<option value="project">Software Project</option>
				<option value="technology">Technology Question</option>
				<option value="career">Career or Networking</option>
				<option value="other">Other</option>
				</select>
			</div>
			<div class="form-group">
				<label for="message">Message:</label>
				<textarea id="message" name="message" rows="6" required></textarea>
			</div>
			<button type="submit">Submit Message</button>
			<p id="form-message" role="status" aria-live="polite"></p>
		</form>
	</section>
</main>

<hr>
<footer>
	<p>Created by Trinity Jamison</p>
</footer>
<script src="script.js"></script>
</body>
</html>
